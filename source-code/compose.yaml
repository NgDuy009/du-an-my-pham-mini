name: cosmetic-mini
services:
  application:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [cosmetic-network]
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cosmetic_mini}
      POSTGRES_USER: ${DB_USER:-cosmetic_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cosmetic_app} -d ${DB_NAME:-cosmetic_mini}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [cosmetic-network]
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cosmeticminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [cosmetic-network]
volumes:
  database-data:
  minio-data:
networks:
  cosmetic-network:
    driver: bridge
